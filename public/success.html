<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order Confirmed - Bella Crust Pizzeria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div class="bg-overlay"></div>

  <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">
    <div class="card success-card shadow-lg border-0 bg-dark text-white rounded-4 p-4 p-md-5 text-center">
      
      <div class="mb-4">
        <div class="success-icon mb-3">
          <i class="bi bi-check-lg"></i>
        </div>
        <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-2 rounded-pill fs-6 mb-2">
          Payment Processed Successfully
        </span>
        <h2 class="display-6 fw-bold text-warning mt-2">Order Confirmed!</h2>
        <p class="text-light opacity-75">Thank you for dining with Bella Crust Pizzeria. Your order is being prepared fresh.</p>
      </div>

      <div class="p-3 border border-secondary rounded-3 bg-secondary bg-opacity-10 text-start mb-4">
        <div class="d-flex justify-content-between text-secondary mb-1">
          <span>Estimated Prep Time:</span>
          <span class="text-warning fw-bold">20 - 25 mins</span>
        </div>
        <div class="d-flex justify-content-between text-secondary">
          <span>Status:</span>
          <span class="text-success fw-semibold"><i class="bi bi-fire me-1"></i>In the oven</span>
        </div>
      </div>

      <button id="returnHome" class="btn btn-warning btn-lg fw-bold text-dark w-100">
        <i class="bi bi-house-door-fill me-2"></i>Return to Homepage
      </button>

    </div>
  </div>

  <script>
    document.getElementById("returnHome").addEventListener("click", function() {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
